name: Lua syntax and resource structure

on:
  push:
    paths:
      - '**/*.lua'
      - 'fxmanifest.lua'
      - '.github/workflows/lua-check.yml'
  pull_request:
    paths:
      - '**/*.lua'
      - 'fxmanifest.lua'
      - '.github/workflows/lua-check.yml'

jobs:
  lua-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua 5.4 compiler
        run: sudo apt-get update && sudo apt-get install -y lua5.4
      - name: Compile-check every Lua source
        run: |
          set -euo pipefail
          find . -type f -name '*.lua' -not -path './.git/*' -print0 |
            while IFS= read -r -d '' file; do
              echo "Checking $file"
              luac5.4 -p "$file"
            done
      - name: Detect duplicate event and callback registrations
        run: |
          python3 - <<'PY'
          import pathlib, re, collections, sys
          files = list(pathlib.Path('server').glob('*.lua'))
          patterns = [
              re.compile(r"RegisterNetEvent\s*\(\s*['\"]([^'\"]+)['\"]"),
              re.compile(r"lib\.callback\.register\s*\(\s*['\"]([^'\"]+)['\"]"),
          ]
          found = collections.defaultdict(list)
          for file in files:
              source = file.read_text(encoding='utf-8')
              for pattern in patterns:
                  for match in pattern.finditer(source):
                      found[match.group(1)].append(str(file))
          duplicate = {name: locations for name, locations in found.items() if len(locations) > 1}
          for name, locations in sorted(duplicate.items()):
              print(f'Duplicate server handler {name}: {locations}', file=sys.stderr)
          if duplicate:
              sys.exit(1)
          print(f'Checked {len(found)} distinct server event/callback registrations')
          PY
      - name: Verify resource entrypoints
        run: |
          test -f fxmanifest.lua
          test -f server/server.lua
          test -f server/catalog.lua
          test -f client/main.lua
          test -f client/catalog.lua
          test -f sql/pm_education_enrollment_revision_migration.sql
          test -f sql/pm_education_exam_revision_migration.sql
