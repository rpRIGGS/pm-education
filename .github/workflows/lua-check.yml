name: Lua syntax and resource structure

on:
  push:
    paths:
      - '**/*.lua'
      - 'fxmanifest.lua'
      - 'sql/**'
      - '.github/workflows/lua-check.yml'
  pull_request:
    paths:
      - '**/*.lua'
      - 'fxmanifest.lua'
      - 'sql/**'
      - '.github/workflows/lua-check.yml'

jobs:
  lua-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua 5.4 compiler
        run: sudo apt-get update && sudo apt-get install -y lua5.4
      - name: Compile-check every Lua source
        run: |
          set -euo pipefail
          find . -type f -name '*.lua' -not -path './.git/*' -print0 |
            while IFS= read -r -d '' file; do
              echo "Checking $file"
              luac5.4 -p "$file"
            done
      - name: Detect duplicate event and callback registrations
        run: |
          python3 - <<'PY'
          import pathlib, re, collections, sys
          files = list(pathlib.Path('server').glob('*.lua'))
          patterns = [
              re.compile(r"RegisterNetEvent\s*\(\s*['\"]([^'\"]+)['\"]"),
              re.compile(r"lib\.callback\.register\s*\(\s*['\"]([^'\"]+)['\"]"),
          ]
          found = collections.defaultdict(list)
          for file in files:
              source = file.read_text(encoding='utf-8')
              for pattern in patterns:
                  for match in pattern.finditer(source):
                      found[match.group(1)].append(str(file))
          duplicate = {name: locations for name, locations in found.items() if len(locations) > 1}
          for name, locations in sorted(duplicate.items()):
              print(f'Duplicate server handler {name}: {locations}', file=sys.stderr)
          if duplicate:
              sys.exit(1)
          print(f'Checked {len(found)} distinct server event/callback registrations')
          PY
      - name: Verify client/server callback wiring
        run: |
          python3 - <<'PY'
          import pathlib, re, sys
          client = '\n'.join(path.read_text(encoding='utf-8') for path in pathlib.Path('client').glob('*.lua'))
          server = '\n'.join(path.read_text(encoding='utf-8') for path in pathlib.Path('server').glob('*.lua'))
          used = set(re.findall(r"lib\.callback\.await\(['\"]pm-education:server:([\w]+)['\"]", client))
          defined = set(re.findall(r"lib\.callback\.register\(['\"]pm-education:server:([\w]+)['\"]", server))
          missing = sorted(used - defined)
          if missing:
              print('Client callbacks missing server handlers: ' + ', '.join(missing), file=sys.stderr)
              sys.exit(1)
          print(f'Validated {len(used)} client callback names against server handlers')
          PY
      - name: Verify POST pilot and placeholder isolation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import sys
          config = Path('config.lua').read_text(encoding='utf-8')
          client = Path('client/main.lua').read_text(encoding='utf-8')
          server = Path('server/server.lua').read_text(encoding='utf-8')
          required = [
              "Config.Institutions.post = {",
              "credentialId = 'post_basic_accreditation'",
              "{ id = 'code5', label = 'Code 5 Traffic Stop' }",
              "{ id = 'pursuit', label = 'Vehicle Pursuit' }",
              "{ id = 'evasive', label = 'Evasive Driving' }",
          ]
          missing = [part for part in required if part not in config]
          if missing:
              sys.exit('POST pilot configuration missing: ' + ', '.join(missing))
          for token in (
              "pm-education:server:myCourseProgress",
              "pm-education:server:myPracticalChecklist",
              "pm-education:server:adminStudents",
          ):
              if token not in client or token not in server:
                  sys.exit('POST client/server workflow missing: ' + token)
          for token in ("admissions = {}", "examiners = {}", "management = {}"):
              if token not in config.split("Config.Institutions.post = {", 1)[1].split("Config.Institutions.safr =", 1)[0]:
                  sys.exit('POST deployment placeholder changed unexpectedly: ' + token)
          print('POST pilot course, practicals, client/server flows and safe placeholders verified')
          PY
      - name: Verify POST payment, exam and assessment safety contracts
        run: |
          python3 - <<'PY'
          from pathlib import Path
          server = Path('server/server.lua').read_text(encoding='utf-8')
          client = Path('client/main.lua').read_text(encoding='utf-8')
          readiness = Path('server/post_readiness.lua').read_text(encoding='utf-8')
          required_server = {
              'disconnect enrollment lock ownership': 'enrollmentLockOwners[source]',
              'exam lookup failure isolation': 'pcall(getQuestions, institutionId, courseId, record.id)',
              'exam curriculum failure isolation': 'pcall(getCourse, institutionId, courseId, record.id)',
              'practical completion institution scope': 'FROM pm_education_practical_results WHERE enrollment_id = ? AND institution_id = ? AND course_id = ?',
              'credential completion transaction': 'MySQL.transaction.await(statements)',
              'payment ledger reconciliation failure': "Society credit for payment #%s needs manual ledger reconciliation",
              'exam submission session lock': 'session.submitting = true',
              'exam result persistence before session consumption': '-- Persisted attempt is authoritative. Never accept the same session again.',
              'exam retry uses original questions': "TriggerClientEvent('pm-education:client:exam', src, institutionId, courseId, session.questions)",
              'cancel rejects in-flight submission': 'if not session or session.pending or session.submitting or',
              'curriculum lookup recovery': 'Assigned curriculum temporarily unavailable. Your paid exam will reopen without a new charge.',
              'exam retry does not start new payment': 'questions = questions, passPercent = threshold',
              'practical evaluation lock': 'if practicalLocks[enrollmentId] then',
              'practical lock cleanup': 'practicalLocks[enrollmentId] = nil',
              'practical failure isolation': "Practical evaluation failed for enrollment #%s",
              'blank exam question rejection': "type(question.question) ~= 'string' or question.question == ''",
              'pending exam source ownership': 'local function stillOwner()',
              'pending exam identity cleanup': 'if activeExams[src] == pendingSession then activeExams[src] = nil end',
              'abandoned paid exam refund': 'Exam request abandoned after debit',
              'exam delivery source ownership': 'activeExams[src] ~= examSession or not currentPlayer',
              'exam submit source ownership': 'local function stillOwner()',
              'exam submit session cleanup': 'if activeExams[src] == session then activeExams[src] = nil end',
              'practical reauthorization after queries': 'Instructor authorization expired; evaluation not saved.',
          }
          required_client = {
              'student progress refresh': 'Refresh progress',
              'instructor assessment history': 'Practical Assessment History',
              'completed assessment read-only': "disabled = student.status ~= 'enrolled' and student.status ~= 'in_progress'",
              'credential roster refresh': 'Refresh student roster',
              'instructor roster refresh': 'Refresh instructor roster',
          }
          required_readiness = {
              'POST console-only command': "RegisterCommand('pm_education_post_check'",
              'POST examiner course check': "examinerOffers(institution.examiners, 'post_basic')",
              'POST practical requirements': 'POST practical requirements configured',
          }
          for group, source, checks in (
              ('server', server, required_server),
              ('client', client, required_client),
              ('readiness', readiness, required_readiness),
          ):
              for label, token in checks.items():
                  if token not in source:
                      raise SystemExit(f'Missing POST {group} safety contract: {label}')
          print('POST payment, exam, assessment, permissions UI and readiness contracts verified')
          PY
      - name: Verify resource entrypoints
        run: |
          test -f fxmanifest.lua
          test -f server/server.lua
          test -f server/catalog.lua
          test -f client/main.lua
          test -f client/catalog.lua
          test -f sql/pm_education_enrollment_revision_migration.sql
          test -f sql/pm_education_exam_revision_migration.sql
          test -f sql/pm_education_catalog_published_uniqueness_migration.sql
          python3 - <<'PY'
          import pathlib, re, sys
          manifest = pathlib.Path('fxmanifest.lua').read_text(encoding='utf-8')
          missing = []
          for entry in re.findall(r"['\"]([^'\"]+\.lua)['\"]", manifest):
              if entry.startswith('@'):
                  continue
              if not pathlib.Path(entry).is_file():
                  missing.append(entry)
          if missing:
              print('Missing manifest Lua files:', ', '.join(missing), file=sys.stderr)
              sys.exit(1)
          print('Manifest Lua paths resolve')
          PY

  sql-migrations:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: testroot
          MARIADB_DATABASE: pm_education_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - name: Install MariaDB client
        run: sudo apt-get update && sudo apt-get install -y mariadb-client
      - name: Apply initial schema and revision migrations
        env:
          MYSQL_PWD: testroot
        run: |
          set -euo pipefail
          for file in \
            sql/pm_education.sql \
            sql/pm_education_catalog.sql \
            sql/pm_education_catalog_attempts_migration.sql \
            sql/pm_education_enrollment_revision_migration.sql \
            sql/pm_education_exam_revision_migration.sql; do
            echo "Applying $file"
            mariadb -h 127.0.0.1 -u root pm_education_test < "$file"
          done
      - name: Validate catalog uniqueness and revision columns
        env:
          MYSQL_PWD: testroot
        run: |
          set -euo pipefail
          mariadb -h 127.0.0.1 -u root pm_education_test <<'SQL'
          INSERT INTO pm_education_catalog (institution_id, content_type, content_key, revision, status, payload_json)
          VALUES ('post', 'course', 'post_basic', 1, 'published', '{}');
          INSERT INTO pm_education_catalog (institution_id, content_type, content_key, revision, status, payload_json)
          VALUES ('post', 'course', 'post_basic', 2, 'draft', '{}');
          SELECT curriculum_revision_id, exam_revision_id FROM pm_education_enrollments LIMIT 0;
          SELECT catalog_revision_id FROM pm_education_attempts LIMIT 0;
          SQL
          if mariadb -h 127.0.0.1 -u root pm_education_test -e \
            "INSERT INTO pm_education_catalog (institution_id, content_type, content_key, revision, status, payload_json) VALUES ('post', 'course', 'post_basic', 3, 'published', '{}')"; then
            echo "ERROR: database accepted two published revisions" >&2
            exit 1
          fi
          mariadb -h 127.0.0.1 -u root pm_education_test -e \
            "UPDATE pm_education_catalog SET status = 'retired' WHERE revision = 1 AND institution_id = 'post' AND content_key = 'post_basic'; UPDATE pm_education_catalog SET status = 'published' WHERE revision = 2 AND institution_id = 'post' AND content_key = 'post_basic';"
      - name: Verify credential award uniqueness and rollback
        env:
          MYSQL_PWD: testroot
        run: |
          set -euo pipefail
          mariadb -h 127.0.0.1 -u root pm_education_test <<'SQL'
          INSERT INTO pm_education_enrollments (citizenid,institution_id,course_id)
          VALUES ('ci-test','post','post_basic');
          INSERT INTO pm_education_credentials (enrollment_id,citizenid,institution_id,credential_id,credential_label)
          VALUES (1,'ci-test','post','post_basic_accreditation','Test Accreditation');
          SQL
          if mariadb -h 127.0.0.1 -u root pm_education_test -e \
            "INSERT INTO pm_education_credentials (enrollment_id,citizenid,institution_id,credential_id,credential_label) VALUES (1,'ci-test','post','post_basic_accreditation','Duplicate')"; then
            echo "ERROR: duplicate credential award accepted" >&2
            exit 1
          fi
          mariadb -h 127.0.0.1 -u root pm_education_test <<'SQL'
          START TRANSACTION;
          UPDATE pm_education_enrollments SET status = 'completed' WHERE id = 1;
          ROLLBACK;
          SQL
          test "$(mariadb -h 127.0.0.1 -u root -N -s pm_education_test -e \
            "SELECT status FROM pm_education_enrollments WHERE id=1")" = "enrolled"

